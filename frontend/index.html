<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voyager — travel planning agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #101f27;
    --surface: #17303c;
    --surface-2: #1e3a47;
    --line: #2c4d5b;
    --gold: #e0a85c;
    --gold-dim: #b98c53;
    --text: #edf1f2;
    --muted: #90a8b3;
    --user-bubble: #24444f;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
  }

  .app{
    width:100%;
    max-width:720px;
    display:flex;
    flex-direction:column;
    height:100vh;
    padding: 0 20px;
  }

  header{
    padding: 28px 4px 18px;
    border-bottom: 1px solid var(--line);
  }
  .route{
    display:flex;
    align-items:center;
    gap:10px;
    color: var(--gold);
    margin-bottom:10px;
  }
  .route svg{ width:22px; height:22px; }
  .route span{
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 30px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  header p{
    margin:0;
    color: var(--muted);
    font-size: 14.5px;
    max-width: 46ch;
  }

  #thread{
    flex:1;
    overflow-y:auto;
    padding: 24px 4px 12px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .msg{
    display:flex;
    flex-direction:column;
    max-width: 88%;
  }
  .msg.user{ align-self:flex-end; align-items:flex-end; }
  .msg.agent{ align-self:flex-start; align-items:flex-start; }

  .label{
    font-size:11.5px;
    color: var(--muted);
    margin-bottom:6px;
    padding: 0 2px;
  }
  .msg.agent .label{ font-family:'Fraunces', serif; color: var(--gold-dim); font-size:13px; }

  .bubble{
    padding: 13px 16px;
    border-radius: 3px;
    line-height:1.55;
    font-size: 15px;
    white-space: pre-wrap;
  }
  .msg.user .bubble{
    background: var(--user-bubble);
    border-radius: 10px 10px 2px 10px;
  }
  .msg.agent .bubble{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 2px 10px 10px 10px;
    position: relative;
  }
  .msg.agent .bubble::before{
    content:"";
    position:absolute;
    left:-1px; top:10px; bottom:10px;
    width:3px;
    background: var(--gold);
    border-radius: 2px;
  }
  .msg.agent .bubble{ padding-left: 20px; }

  .thinking{
    display:flex; gap:5px; align-items:center; padding: 4px 2px;
  }
  .thinking span{
    width:6px; height:6px; border-radius:50%;
    background: var(--gold-dim);
    animation: pulse 1.1s infinite ease-in-out;
  }
  .thinking span:nth-child(2){ animation-delay:0.15s; }
  .thinking span:nth-child(3){ animation-delay:0.3s; }
  @keyframes pulse{
    0%,80%,100%{ opacity:0.25; transform: scale(0.85);}
    40%{ opacity:1; transform: scale(1);}
  }

  form{
    display:flex;
    gap:10px;
    padding: 16px 4px 22px;
    border-top: 1px solid var(--line);
  }
  textarea{
    flex:1;
    resize:none;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text);
    font-family:'Inter',sans-serif;
    font-size: 15px;
    border-radius: 10px;
    padding: 12px 14px;
    line-height:1.4;
    height: 48px;
    max-height: 140px;
  }
  textarea:focus{ outline:none; border-color: var(--gold-dim); }
  button{
    background: var(--gold);
    color: #1a1206;
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size: 14.5px;
    padding: 0 22px;
    border-radius: 10px;
    cursor:pointer;
  }
  button:disabled{ opacity:0.5; cursor:default; }
  button:not(:disabled):hover{ background: #ecb877; }

  #error-banner{
    display:none;
    background: #3a2020;
    border: 1px solid #6b3434;
    color: #f3c6c6;
    font-size: 13.5px;
    padding: 10px 14px;
    border-radius: 8px;
    margin: 10px 4px 0;
  }

  @media (prefers-reduced-motion: reduce){
    .thinking span{ animation:none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="route">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 12h4l3-7 5 14 3-7h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>AI TRAVEL PLANNING AGENT</span>
    </div>
    <h1>Voyager</h1>
    <p>Tell me where you want to go and when — I'll pull flights, hotels, weather and a day-by-day plan together.</p>
  </header>

  <div id="thread"></div>
  <div id="error-banner"></div>

  <form id="composer">
    <textarea id="input" placeholder="e.g. Plan me 4 days in Lisbon in early November, budget around $1500" rows="1"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
  const API_URL = "http://localhost:8000/api/chat";

  const thread = document.getElementById('thread');
  const form = document.getElementById('composer');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const errorBanner = document.getElementById('error-banner');

  let history = [];

  function addMessage(role, text){
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = role === 'user' ? 'You' : 'Voyager';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.appendChild(label);
    wrap.appendChild(bubble);
    thread.appendChild(wrap);
    thread.scrollTop = thread.scrollHeight;
    return bubble;
  }

  function addThinking(){
    const wrap = document.createElement('div');
    wrap.className = 'msg agent';
    wrap.id = 'thinking-row';
    const bubble = document.createElement('div');
    bubble.className = 'bubble thinking';
    bubble.innerHTML = '<span></span><span></span><span></span>';
    wrap.appendChild(bubble);
    thread.appendChild(wrap);
    thread.scrollTop = thread.scrollHeight;
  }

  function removeThinking(){
    const row = document.getElementById('thinking-row');
    if (row) row.remove();
  }

  function showError(msg){
    errorBanner.textContent = msg;
    errorBanner.style.display = 'block';
  }
  function clearError(){
    errorBanner.style.display = 'none';
  }

  async function sendMessage(text){
    addMessage('user', text);
    addThinking();
    sendBtn.disabled = true;
    clearError();

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history })
      });

      if (!res.ok){
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || ('Request failed with status ' + res.status));
      }

      const data = await res.json();
      history = data.history;
      removeThinking();
      addMessage('agent', data.reply);
    } catch (e) {
      removeThinking();
      showError("Couldn't reach the planning agent — is the backend running at " + API_URL + "? (" + e.message + ")");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.style.height = '48px';
    sendMessage(text);
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener('input', () => {
    input.style.height = '48px';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  addMessage('agent', "Hi! I'm Voyager. Where are you thinking of going, and what dates are you working with?");
</script>
<script type="text/javascript">
    (function (l) {
      if (l.search[1] === "/") {
        var decoded = l.search
          .slice(1)
          .split("&")
          .map(function (s) {
            return s.replace(/~and~/g, "&");
          })
          .join("?");
        window.history.replaceState(
          null,
          null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    })(window.location);
  </script>
</body>
</html>
